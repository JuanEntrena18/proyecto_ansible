# docker-compose.yml
# Con esto levantamos todo el proyecto: docker compose up -d
# Son tres contenedores: el backend (API + nmap + ansible), nginx y el backup
 
services:
 
  # El backend: aqui esta la API, nmap y ansible
  backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host    # necesario para que nmap vea la red real del aula
    cap_add:
      - NET_RAW
    environment:
      - ANSIBLE_CONFIG=/opt/ansible-visual/ansible/ansible.cfg
      - ANSIBLE_ROLES_PATH=/opt/ansible-visual/ansible/roles
      - ANSIBLE_COLLECTIONS_PATH=/root/.ansible/collections:/usr/share/ansible/collections
    volumes:
      - ./ansible:/opt/ansible-visual/ansible
      # credentials.json ya no es read-only: el backend necesita poder escribirlo
      # cuando el profesor guarda las credenciales desde la web
      - ./config/credentials.json:/opt/ansible-visual/credentials.json
    # El backend no expone puertos directamente, nginx hace de proxy
    # Pero si necesitas acceder directo en desarrollo, descomenta:
    # ports:
    #   - "127.0.0.1:8000:8000"
 
  # Nginx: sirve la pagina web y redirige las peticiones /api/ al backend
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    volumes:
      - ./frontend:/var/www/ansible-visual/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
 
  # Servicio de backup: corre en Alpine para que sea ligero
  # Hace una copia comprimida cada dia a las 02:00 de:
  #   - ansible/playbooks/custom  (playbooks creados por los profes)
  #   - ansible/logs              (historial de ejecuciones)
  #   - config/credentials.json   (credenciales de los equipos)
  # Guarda los ultimos 30 dias y borra los mas antiguos automaticamente
  # Para lanzar un backup manual ahora mismo:
  #   docker compose exec backup /backup.sh
  backup:
    image: alpine:3.19
    restart: unless-stopped
    volumes:
      # lo que queremos respaldar (solo lectura para no romper nada)
      - ./ansible/playbooks/custom:/data/playbooks:ro
      - ./ansible/logs:/data/logs:ro
      - ./config/credentials.json:/data/credentials.json:ro
      # donde se guardan los backups en el host
      - ./backups:/backups
      # el script de backup
      - ./scripts/backup.sh:/backup.sh:ro
    # crond de Alpine necesita que el script este en /etc/periodic/
    # usamos 'daily' para que corra una vez al dia
    # tambien lo ejecutamos una vez al arrancar para tener backup inmediato
    command: >
      sh -c "cp /backup.sh /etc/periodic/daily/backup &&
             chmod +x /etc/periodic/daily/backup &&
             /backup.sh &&
             crond -f -d 8"
    # sin acceso a red, no lo necesita
    network_mode: none
