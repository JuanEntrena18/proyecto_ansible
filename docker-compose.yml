# docker-compose.yml
# Con esto levantamos todo el proyecto: docker compose up -d
# Son dos contenedores: el backend (API + nmap + ansible) y nginx

services:

  # El backend: aqui esta la API, nmap y ansible
  backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host    # necesario para que nmap vea la red real del aula
    cap_add:
      - NET_RAW
    environment:
      - ANSIBLE_CONFIG=/opt/ansible-visual/ansible/ansible.cfg
      - ANSIBLE_ROLES_PATH=/opt/ansible-visual/ansible/roles
      - ANSIBLE_COLLECTIONS_PATH=/root/.ansible/collections:/usr/share/ansible/collections
    volumes:
      - ./ansible:/opt/ansible-visual/ansible
      - ./config/credentials.json:/opt/ansible-visual/credentials.json:ro

  # Nginx: sirve la pagina web y redirige las peticiones /api/ al backend
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    volumes:
      - ./frontend:/var/www/ansible-visual/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
