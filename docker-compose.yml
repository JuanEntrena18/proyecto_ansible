version: '3.8'

services:
  # El backend: gestiona la API, escaneos Nmap y ejecución de Ansible
  backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host    # Imprescindible para el descubrimiento de red local vía Nmap
    cap_add:
      - NET_RAW
    environment:
      - ANSIBLE_CONFIG=/opt/ansible-visual/ansible/ansible.cfg
      - ANSIBLE_ROLES_PATH=/opt/ansible-visual/ansible/roles
      - ANSIBLE_COLLECTIONS_PATH=/root/.ansible/collections:/usr/share/ansible/collections
      - CREDENTIALS_KEY=${CREDENTIALS_KEY:-} # Requerido para descifrar credenciales de hosts
    volumes:
      - ./ansible:/opt/ansible-visual/ansible
      - ./config/credentials.json:/opt/ansible-visual/credentials.json
      # Persistencia de estado: Usuarios e Inventario del aula
      - ./data/usuarios.db:/opt/ansible-visual/usuarios.db
      - ./data/inventory.json:/opt/ansible-visual/inventory.json

  # Nginx: Servidor web y proxy inverso con soporte SSL
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    volumes:
      - ./frontend:/var/www/ansible-visual/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro

  # Servicio de backup: Automatización diaria de copias de seguridad
  backup:
    image: alpine:3.19
    restart: unless-stopped
    volumes:
      # Orígenes de datos (Modo Solo Lectura para integridad)
      - ./ansible/playbooks/custom:/data/playbooks:ro
      - ./ansible/logs:/data/logs:ro
      - ./config/credentials.json:/data/credentials.json:ro
      - ./data/usuarios.db:/data/usuarios.db:ro
      - ./data/inventory.json:/data/inventory.json:ro
      # Destino y script de ejecución
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "apk add --no-cache openssh-client &&
             cp /backup.sh /etc/periodic/daily/backup &&
             chmod +x /etc/periodic/daily/backup &&
             /backup.sh &&
             crond -f -d 8"
