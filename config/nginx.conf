server {
    listen 80 default_server;
    server_name _;

    root /var/www/ansible-visual/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # todo lo que venga por /api/ se lo mandamos al backend de FastAPI
    # quitando el prefijo /api/ del path
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        # esto es importante: sin proxy_buffering off la salida en streaming
        # de los playbooks no llega al navegador hasta que termina todo
        proxy_buffering off;
    }
}
