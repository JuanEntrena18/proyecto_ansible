# Configura el firewall con los puertos necesarios.
# La lista de puertos se configura en inventory/group_vars/
---
- name: Configurar firewall (Windows)
  hosts: windows
  gather_facts: false
  tasks:
    - name: Abrir puertos configurados
      community.windows.win_firewall_rule:
        name: "{{ item.name }}"
        localport: "{{ item.port }}"
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true
      loop: "{{ win_firewall_rules }}"

- name: Configurar firewall (Linux)
  hosts: linux
  become: true
  tasks:
    - name: Instalar ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Permitir puertos configurados
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop: "{{ linux_firewall_ports }}"

    - name: Activar UFW
      community.general.ufw:
        state: enabled
