# Habilita el Escritorio Remoto (RDP) en equipos Windows.
# Permite al profesor o tecnico conectarse al escritorio
# de cualquier equipo del aula de forma remota.
---
- name: Habilitar Escritorio Remoto (Windows)
  hosts: windows
  gather_facts: false
  tasks:
    - name: Activar RDP en el registro
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: Desactivar NLA
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: UserAuthentication
        data: 0
        type: dword

    - name: Abrir puerto RDP en el firewall
      community.windows.win_firewall_rule:
        name: "Escritorio Remoto (TCP)"
        localport: 3389
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true

    - name: Arrancar servicio Escritorio Remoto
      ansible.windows.win_service:
        name: TermService
        start_mode: auto
        state: started

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: "Escritorio Remoto habilitado y listo."
